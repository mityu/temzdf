[workspace]
resolver = "3"
members = ["crates/termpix", "crates/termpix-ui", "crates/temzdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/mityu/temzdf-cli"

[workspace.dependencies]
termpix = { path = "crates/termpix" }
termpix-ui = { path = "crates/termpix-ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
