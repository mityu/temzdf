[workspace]
resolver = "3"
members = [
    "crates/termpix-core",
    "crates/termpix",
    "crates/termpix-ui",
    "crates/temzdf-scene",
    "crates/temzdf-pdfcore",
    "crates/temzdf-pdfview",
    "crates/temzdf-term",
    "crates/temzdf-texteditor",
    "crates/temzdf-markdown",
    "crates/temzdf-script",
    "crates/temzdf-script-guest",
    "crates/temzdf-script-runner",
    "crates/temzdf-tty",
    "crates/temzdf-protocol",
    "crates/temzdf-client",
    "crates/temzdf-gui",
    "crates/temzdf-server",
    "crates/temzdf",
    "crates/tuitest",
    "crates/wlinput",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/mityu/temzdf-cli"

[workspace.dependencies]
termpix = { path = "crates/termpix" }
termpix-core = { path = "crates/termpix-core" }
termpix-ui = { path = "crates/termpix-ui" }
temzdf-scene = { path = "crates/temzdf-scene" }
temzdf-pdfcore = { path = "crates/temzdf-pdfcore" }
temzdf-pdfview = { path = "crates/temzdf-pdfview" }
temzdf-term = { path = "crates/temzdf-term" }
temzdf-texteditor = { path = "crates/temzdf-texteditor" }
temzdf-markdown = { path = "crates/temzdf-markdown" }
temzdf-script = { path = "crates/temzdf-script", default-features = false }
temzdf-script-runner = { path = "crates/temzdf-script-runner" }
temzdf-tty = { path = "crates/temzdf-tty" }
temzdf-server = { path = "crates/temzdf-server" }
temzdf-protocol = { path = "crates/temzdf-protocol", default-features = false }
temzdf-client = { path = "crates/temzdf-client" }
tuitest = { path = "crates/tuitest" }
anyhow = "1.0.104"
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "system-fonts"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The script host's guest (crates/temzdf-script-runner/build.rs builds it
# for wasm32-wasip1 with this profile, debug or release alike): small where
# size matters (swc stripping TypeScript, run once per load), fast where
# scripts spend their time (QuickJS, its bindings and the host's loop).
[profile.script-guest]
inherits = "release"
opt-level = "s"
strip = true

[profile.script-guest.package.rquickjs-sys]
opt-level = 3

[profile.script-guest.package.rquickjs-core]
opt-level = 3

[profile.script-guest.package.temzdf-script]
opt-level = 3

# MuPDF as it ships even in debug builds: optimized, so mupdf-sys builds it
# without debug assertions (a debug MuPDF aborted on PDFs whose ActualText is
# shorter than its glyphs; see doc/dev/known-issues.md), and quicker.
[profile.dev.package.mupdf-sys]
opt-level = 2
