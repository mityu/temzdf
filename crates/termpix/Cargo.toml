[package]
name = "termpix"
description = "Pixel-level terminal UI plumbing: kitty graphics output, layered compositing and pixel-precise input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
termpix-core.workspace = true

# The terminal (termios, signals) and POSIX shared memory: Unix only so far.
[target.'cfg(unix)'.dependencies]
memmap2 = "0.9.12"
rustix = { version = "1.1.5", features = ["termios", "shm", "fs", "event", "stdio", "process", "mm"] }
signal-hook = "0.4.5"

# The console (crates/termpix/src/tty/windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

# A pseudo-terminal for the panic hook's test.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["pty"] }

[lints]
workspace = true
