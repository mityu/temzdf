[package]
name = "tuitest"
description = "Test harness: run a program on a pty behind Ghostty's terminal emulation (libghostty-vt), drive it with keys and read its screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libghostty-vt = "0.2.2"
libghostty-vt-sys = { version = "0.2.2", features = ["pkg-config"] }
portable-pty = "0.9.0"
termpix-core.workspace = true
termpix-ui.workspace = true

# Where portable-pty's conpty.dll may come from (dll_search_restricted).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
temzdf-testhelper.workspace = true

[lints]
workspace = true
