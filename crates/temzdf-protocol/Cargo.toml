[package]
name = "temzdf-protocol"
description = "Messages, framing and socket locations of temzdf sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
memmap2 = "0.9.12"
rustix = { version = "1.1.5", features = ["fs", "mm", "net", "process", "shm"] }
serde = { version = "1.0.229", features = ["derive"] }
temzdf-scene = { workspace = true, features = ["serde"] }
termpix-core = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[lints]
workspace = true
