[package]
name = "temzdf-protocol"
description = "Messages, framing and socket locations of temzdf sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["session"]
# The session's messages and sockets; without it, only the script host's
# messages and the framing (what the WebAssembly guest needs).
session = ["dep:memmap2", "dep:rustix", "dep:temzdf-scene", "dep:termpix-core", "dep:libc"]

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
memmap2 = { version = "0.9.12", optional = true }
rustix = { version = "1.1.5", features = ["fs", "mm", "net", "process", "shm"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
temzdf-scene = { workspace = true, features = ["serde"], optional = true }
termpix-core = { workspace = true, features = ["serde"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.191", optional = true }

[lints]
workspace = true
