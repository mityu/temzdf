[package]
name = "temzdf-term"
description = "temzdf terminal panes: a pty and Ghostty's terminal emulation (libghostty-vt), shown as temzdf-scene text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libghostty-vt = "0.2.2"
png = "0.18.1"
# Link the libghostty-vt found by pkg-config (nix/libghostty-vt.nix builds it
# from the commit these bindings were generated from) instead of building
# Ghostty with Zig inside cargo.
libghostty-vt-sys = { version = "0.2.2", features = ["pkg-config"] }
portable-pty = "0.9.0"
temzdf-scene.workspace = true
termpix-core.workspace = true

# The pty's threads and signals (`src/pty.rs`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["event", "process"] }

# Whether ConPTY is there, where its DLL may come from, and Ctrl+C for a
# pane's program (`src/pty.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader"] }

# The tests' look at a pane's processes (`src/lib.rs`, `conpty`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
temzdf-testhelper.workspace = true

[lints]
workspace = true
