[package]
name = "temzdf"
description = "Terminal PDF viewer drawn with the kitty graphics protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
temzdf-client.workspace = true
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
temzdf-pdfview.workspace = true
temzdf-protocol = { workspace = true, features = ["session"] }
temzdf-scene.workspace = true
temzdf-script.workspace = true
temzdf-server.workspace = true
termpix-core.workspace = true

# The terminal frontend (attach, standalone, render-session): Unix only. On
# Windows `temzdf` is the server and the client commands; temzdf-gui shows
# sessions there.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }
temzdf-tty.workspace = true
termpix.workspace = true

[dev-dependencies]
temzdf-pdfcore = { workspace = true, features = ["test-support"] }
tuitest.workspace = true
# Images written in tests (loadImage).
png = "0.18.1"

[lints]
workspace = true
