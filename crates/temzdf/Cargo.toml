[package]
name = "temzdf"
description = "Terminal PDF viewer drawn with the kitty graphics protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
termpix.workspace = true
temzdf-pdfcore.workspace = true
temzdf-pdfview.workspace = true
temzdf-scene.workspace = true
temzdf-tty.workspace = true
toml = "1.1.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[lints]
workspace = true
