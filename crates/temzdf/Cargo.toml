[package]
name = "temzdf"
description = "Terminal PDF viewer drawn with the kitty graphics protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
temzdf-client.workspace = true
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.5", features = ["process"] }
termpix.workspace = true
temzdf-pdfview.workspace = true
temzdf-protocol.workspace = true
temzdf-scene.workspace = true
temzdf-script.workspace = true
temzdf-server.workspace = true
temzdf-tty.workspace = true

[dev-dependencies]
temzdf-pdfcore = { workspace = true, features = ["test-support"] }
tuitest.workspace = true

[lints]
workspace = true
