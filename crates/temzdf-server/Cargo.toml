[package]
name = "temzdf-server"
description = "temzdf sessions: panes on documents, layout, prefix keys and the composed frame; the session server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
temzdf-pdfcore.workspace = true
temzdf-pdfview.workspace = true
temzdf-paths.workspace = true
temzdf-protocol = { workspace = true, features = ["session"] }
temzdf-script-runner.workspace = true
temzdf-texteditor.workspace = true
temzdf-watchfs.workspace = true
temzdf-markdown.workspace = true
temzdf-mdview.workspace = true
texprintf.workspace = true
# Images in text panes (loadImage, the Markdown viewer).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The Markdown viewer's remote images (markdown.loadRemoteImages).
ureq = "3.5.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
temzdf-scene.workspace = true
temzdf-term.workspace = true
termpix-core.workspace = true
termpix-ui.workspace = true

# The host name in swap files (`session/swap.rs`): uname's nodename.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["system"] }

# build.rs: the actions' names from crates/temzdf-script/ts-types/temzdf-actions.d.ts
# (the swc crates the script host already uses to strip TypeScript).
[build-dependencies]
swc_common = "26.0.0"
swc_ecma_ast = "29.0.2"
swc_ecma_parser = "46.1.2"

[dev-dependencies]
# Images written in tests (loadImage).
png = "0.18.1"
temzdf-pdfcore = { workspace = true, features = ["test-support"] }
# The programs terminal panes run in tests, in place of `sh`.
temzdf-testhelper.workspace = true
# The mock terminal in tests.
temzdf-tty.workspace = true
termpix.workspace = true

[lints]
workspace = true
