[package]
name = "temzdf-server"
description = "temzdf sessions: panes on documents, layout, prefix keys and the composed frame; the session server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
temzdf-pdfcore.workspace = true
temzdf-pdfview.workspace = true
temzdf-protocol = { workspace = true, features = ["session"] }
temzdf-script-runner.workspace = true
temzdf-texteditor.workspace = true
temzdf-markdown.workspace = true
texprintf.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
temzdf-scene.workspace = true
temzdf-term.workspace = true
termpix-core.workspace = true
termpix-ui.workspace = true

[dev-dependencies]
# Images written in tests (loadImage).
png = "0.18.1"
temzdf-pdfcore = { workspace = true, features = ["test-support"] }
temzdf-tty.workspace = true
termpix.workspace = true

[lints]
workspace = true
