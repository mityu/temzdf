[package]
name = "temzdf-script"
description = "temzdf's script host: runs the JavaScript/TypeScript configuration (rquickjs) and talks to the session over temzdf-protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rquickjs = { version = "0.14.0", features = ["loader", "macro", "classes", "properties"] }
swc_ts_fast_strip = "59.0.2"
swc_common = "26.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
temzdf-protocol.workspace = true

[lints]
workspace = true
