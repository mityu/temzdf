[package]
name = "temzdf-script"
description = "temzdf's script host: runs the JavaScript/TypeScript configuration (rquickjs) and talks to the session over temzdf-protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Not part of the crate: editing a test rebuilds nothing (build.rs).
exclude = ["runtime/**/*.test.ts"]

[features]
default = ["host"]
# The host itself (QuickJS, swc); without it, only the type declarations
# (`temzdf print-types`).
host = [
    "dep:rquickjs",
    "dep:swc_ts_fast_strip",
    "dep:swc_common",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_parser",
    "dep:serde_json",
    "dep:typed-path",
]

[dependencies]
rquickjs = { version = "0.14.0", features = ["loader", "macro", "classes", "properties"], optional = true }
swc_ts_fast_strip = { version = "59.0.2", optional = true }
swc_common = { version = "26.0.0", optional = true }
# temzdf eval's top level (src/eval.rs); as swc_ts_fast_strip takes them.
swc_ecma_ast = { version = "29.0.2", optional = true }
swc_ecma_parser = { version = "46.1.2", default-features = false, features = ["typescript", "unstable"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
temzdf-protocol.workspace = true
# Paths as the session's OS has them (the guest is one build for all).
typed-path = { version = "0.13.0", optional = true }

[build-dependencies]
# runtime/node_modules checked against the lock file.
serde_json = "1.0.149"

[[test]]
name = "host"
required-features = ["host"]

[lints]
workspace = true
