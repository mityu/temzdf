[package]
name = "temzdf-script"
description = "temzdf's script host: runs the JavaScript/TypeScript configuration (rquickjs) and talks to the session over temzdf-protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["host"]
# The host itself (QuickJS, swc); without it, only the type declarations
# (`temzdf print-types`).
host = ["dep:rquickjs", "dep:swc_ts_fast_strip", "dep:swc_common", "dep:serde_json"]

[dependencies]
rquickjs = { version = "0.14.0", features = ["loader", "macro", "classes", "properties"], optional = true }
swc_ts_fast_strip = { version = "59.0.2", optional = true }
swc_common = { version = "26.0.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
temzdf-protocol.workspace = true

[[test]]
name = "host"
required-features = ["host"]

[lints]
workspace = true
