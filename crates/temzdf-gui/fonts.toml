# The fonts temzdf-gui embeds (build.rs), in fallback order: JetBrains Mono,
# the default and first fallback, then Noto Color Emoji and the Nerd Font
# symbols, as WezTerm bundles them.
#
# Nix fetches them from here (`bundleFontFiles` in flake.nix); without Nix,
# `cargo xtask fetch-fonts` puts them in target/fonts/, where build.rs finds
# them. `cargo xtask update-fonts` moves them to the latest releases.
#
# `url` holds `{tag}`, replaced by `tag`, a release tag of `repo` on GitHub.
# The upstream files, not nixpkgs' builds from source (which differ byte for
# byte), so that every build embeds the same fonts.

[[font]]
file = "JetBrainsMono-Regular.ttf"
repo = "JetBrains/JetBrainsMono"
tag = "v2.304"
url = "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/{tag}/fonts/ttf/JetBrainsMono-Regular.ttf"
sha256 = "a0bf60ef0f83c5ed4d7a75d45838548b1f6873372dfac88f71804491898d138f"
license = "OFL-1.1"

