[package]
name = "temzdf-gui"
description = "temzdf's GUI client: a window (winit, wgpu) that attaches to a temzdf session as the terminal client does."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
temzdf-client.workspace = true
temzdf-protocol.workspace = true
temzdf-scene.workspace = true
termpix-core.workspace = true
wgpu = "30.0.1"
glyphon = "0.12.0"
pollster = "0.4.0"
# 0.31 is in beta; its IME and scroll-source fixes are what this client
# needs (doc/gui-client.md). Pinned exactly, updated deliberately.
winit = "=0.31.0-beta.4"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
sys-locale = "0.3.2"
unicode-script = "0.5.8"

# What X11's DPI setting is (src/x11scale.rs); the version winit uses.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.14.0"

[lints]
workspace = true

# GPU tests select a software Vulkan driver through the environment before
# anything else runs, so they have their own main (no test harness threads).
[[test]]
name = "gpu"
harness = false
