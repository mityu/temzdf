[package]
name = "temzdf-client"
description = "What every temzdf client shares: finding, starting and connecting to sessions, log locations, and carrying out effects (links, inverse search)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
temzdf-protocol = { workspace = true, features = ["session"] }
temzdf-scene.workspace = true
termpix-core.workspace = true

# Keeping its own standard handles from the programs it starts
# (std_handles_not_inherited).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
