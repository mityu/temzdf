[package]
name = "temzdf-pdfcore"
description = "temzdf's PDF backend: MuPDF documents, display lists, tile rendering and cache, text, links, search, SyncTeX and reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libz-sys = { version = "1.1.30", features = ["static"] }
mupdf.workspace = true
notify = "8.2.0"
temzdf-scene.workspace = true

[build-dependencies]
cc = "1.10.0"

[features]
# `testing::fixture` for tests in other crates.
test-support = []

[lints]
workspace = true
