[package]
name = "blitz-md"
version = "0.0.0"
edition = "2024"
publish = false

# Outside the root workspace: a spike whose dependencies (Blitz, Stylo)
# must not reach the main Cargo.lock (doc/survey/markdown-viewer.md).
[workspace]

[dependencies]
blitz-dom = "=0.3.0-beta.4"
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
comrak = { version = "0.57", default-features = false }
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
url = "2"
png = "0.18"

[profile.release]
debug = 1
