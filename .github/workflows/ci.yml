name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - 'experiments/**'
      - '**.md'
  pull_request:

permissions:
  contents: read

jobs:
  # rustfmt, clippy (warnings are errors) and tests, fixtures built with TeX
  # from the `ci` dev shell. End-to-end terminal tests stay local (doc/testing.md).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - run: nix develop .#ci --command scripts/check.sh

  # The package output (`nix build`).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - run: nix build --print-build-logs
      - run: ./result/bin/temzdf --help
