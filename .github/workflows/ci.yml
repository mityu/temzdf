name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'doc/**'
      - 'experiments/**'
      - '*.md'
  pull_request:

permissions:
  contents: read

# A newer push to a branch cancels its runs still going; on main every
# run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # script(1), used by the smoke test, comes with util-linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig-dev pkg-config autoconf automake libtool
      # Its default RUSTFLAGS (-D warnings) stay.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: wasm32-wasip1
          cache-shared-key: without-nix
          cache-save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      # libghostty-vt-sys builds libghostty-vt from source with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - run: npm i -g esbuild
      - run: scripts/deps-without-nix.sh "$RUNNER_TEMP/deps" >>"$GITHUB_ENV"
      - run: cargo xtask fetch-fonts
      - run: cargo build --locked -p temzdf -p temzdf-gui
      - run: scripts/smoke-session.sh target/debug

  # rustfmt, clippy (warnings are errors) and tests, fixtures built with TeX
  # from the `ci` dev shell. End-to-end terminal tests stay local (doc/dev/testing.md).
  # Miri runs in a job of its own, beside this one.
  check-with-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Line tables are all a failing test's backtrace needs: the build and
    # rust-cache's saved dependencies are much smaller without full debug
    # information.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The shell's cargo and rustc on PATH: rust-cache runs outside the shell.
      - run: nix develop .#ci --command bash -c 'dirname "$(command -v cargo)"; dirname "$(command -v rustc)"' >>"$GITHUB_PATH"
      # rust-cache keys by every toolchain rustup lists, and the runner
      # image's own stable differs between images; without rustup it keys
      # by the shell's rustc alone.
      - run: rustup self uninstall -y
      # Built dependencies and the crates downloaded, not our own crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      # The shipped scripts' npm packages (tsc reads their types).
      - run: nix develop .#ci --command npm ci --prefix crates/temzdf-script/runtime --no-audit --no-fund
      - run: nix develop .#ci --command scripts/check.sh --verbose --no-miri
      # What a failure leaves: the whole outputs, and the screens of failed
      # simulated-terminal waits.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: |
            target/check/
            target/tuitest/
          if-no-files-found: ignore

  # The unit tests under Miri (scripts/miri.sh), with the nightly toolchain of
  # the `ci-miri` dev shell.
  miri-with-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop .#ci-miri --command bash -c 'dirname "$(command -v cargo)"' >>"$GITHUB_PATH"
      # As in `check-with-nix`.
      - run: rustup self uninstall -y
      # Also Miri's standard library, built by `cargo miri setup`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          cache-directories: ~/.cache/miri
      - run: nix develop .#ci-miri --command scripts/miri.sh
      # Each failed test's log (named on its FAIL line).
      - if: failure()
        run: tail -n +1 target/miri-logs/*.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-logs
          path: target/miri-logs/
          if-no-files-found: ignore

  # The package output (`nix build`).
  build-with-nix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build --print-build-logs
      - run: ./result/bin/temzdf --help

  prune-cache-build:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-without-nix-

  prune-cache-check-with-nix:
    needs: check-with-nix
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-check-

  prune-cache-miri-with-nix:
    needs: miri-with-nix
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-miri-
