name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # rustfmt, clippy (warnings are errors) and tests, fixtures built with TeX
  # from the `ci` dev shell. End-to-end terminal tests stay local (doc/testing.md).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#ci --command scripts/check.sh

  # The package output (`nix build`).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - run: ./result/bin/temzdf --help
