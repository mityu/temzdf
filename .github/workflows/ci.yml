name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'doc/**'
      - 'experiments/**'
      - '*.md'
  pull_request:

permissions:
  contents: read

# Cancel previous run (when not on main branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # script(1), used by the smoke test, comes with util-linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig-dev pkg-config
      # Its default RUSTFLAGS (-D warnings) stay.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: wasm32-wasip1
          cache-shared-key: without-nix
          cache-save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      - name: Setup zig for libghostty-vt builds
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - run: npm i -g esbuild
      - run: scripts/deps-without-nix.sh "$RUNNER_TEMP/deps" >>"$GITHUB_ENV"
      - run: cargo xtask fetch-fonts
      - run: cargo build --locked -p temzdf -p temzdf-gui
      - run: scripts/smoke-session.sh target/debug

  # rustfmt, clippy (warnings are errors) and tests, fixtures built with TeX
  # from the `ci` dev shell. End-to-end terminal tests stay local (doc/dev/testing.md).
  check-with-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Line tables are all a failing test's backtrace needs: the build and
    # rust-cache's saved dependencies are much smaller without full debug
    # information.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The shell's cargo and rustc on PATH: rust-cache runs outside the shell.
      - run: |
          # The single quote after `bash -c` is intentional.
          # shellcheck disable=SC2016
          nix develop .#ci --command bash -c 'dirname "$(command -v cargo)"; dirname "$(command -v rustc)"' >>"$GITHUB_PATH"
      # rust-cache keys by every toolchain rustup lists, and the runner
      # image's own stable differs between images; without rustup it keys
      # by the shell's rustc alone.
      - run: rustup self uninstall -y
      # Built dependencies and the crates downloaded, not our own crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keys are `v0-rust-check-Linux-X64-...`; `prune-cache-check-with-nix` matches `v0-rust-check-`.
          shared-key: check
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      - name: Install npm dependencies
        run: nix develop .#ci --command npm ci --prefix crates/temzdf-script/runtime --no-audit --no-fund
      # Each step's output as it comes, in a log group of its own.
      - run: nix develop .#ci --command cargo xtask check --stream
      - name: Upload logs of check and tuitest on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: |
            target/check/
            target/tuitest/
          if-no-files-found: ignore

  # The gate (`cargo xtask check`) on Windows, for the crates that build there
  # so far (`WINDOWS_CRATES` and `WINDOWS_ONLY_CRATES` in xtask/src/check.rs).
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows builds with MSYS2's UCRT64 (doc/survey/windows-port.md), as
      # scripts/windows/provision.ps1 sets up the VM: its Rust (clippy and
      # rustfmt included, wasm32-wasip1 in -rust-wasm), GCC, Clang for
      # bindgen's libclang, pkgconf and make (mupdf-sys's build), and its
      # WASI sysroot, builtins, wasm-ld and llvm for QuickJS's C in the
      # script guest (WASI_SDK below, instead of the wasi-sdk rquickjs-sys
      # downloads, whose clang needs the MSVC runtime). MSYS2's packages
      # cannot be pinned: each run takes the current ones.
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-rust-wasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-wasi-libc
            mingw-w64-ucrt-x86_64-wasi-compiler-rt
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            make
      # UCRT64's bin on PATH for the PowerShell steps after (rust-cache asks
      # rustc for its version), not MSYS2's usr/bin (whose link.exe and
      # others would shadow tools); the gate itself runs in UCRT64's shell,
      # which adds usr/bin (make), as scripts/windows-vm.sh check does.
      - run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_ENV
          "WASI_SDK=${{ steps.msys2.outputs.msys2-location }}/ucrt64" >> $env:GITHUB_ENV
      # libghostty-vt (terminal panes, tuitest), built once for the GNU
      # target and installed into UCRT64, where pkgconf finds it, as
      # scripts/windows/provision.ps1 does in the VM and Nix on Linux:
      # Ghostty's build picks the MSVC ABI on Windows unless told, and
      # libghostty-vt-sys tells it only when cross-compiling. The commit is
      # nix/libghostty-vt.nix's rev.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - run: |
          rev=$(sed -n 's/^ *rev = "\([0-9a-f]*\)";/\1/p' nix/libghostty-vt.nix)
          dir=$(cygpath -m "$RUNNER_TEMP")/ghostty
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ghostty-org/ghostty.git "$dir"
          git -C "$dir" checkout --quiet "$rev"
          cd "$dir"
          zig build -Demit-lib-vt=true -Doptimize=ReleaseFast -Dcpu=baseline -Demit-xcframework=false \
            -Dapp-runtime=none -Dtarget=x86_64-windows-gnu --prefix "$(cygpath -m "$MINGW_PREFIX")"
          pkg-config --modversion libghostty-vt-static
        shell: msys2 {0}
        env:
          # Not setup-zig's .zig-cache in the checkout, where the gate's
          # document check would read the packages' Markdown.
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keys are `v0-rust-windows-Windows-X64-...`; `prune-cache-windows` matches `v0-rust-windows-`.
          shared-key: windows
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      # The shipped scripts' npm packages (tsc reads their types).
      - run: npm ci --prefix crates/temzdf-script/runtime --no-audit --no-fund
      # The version of biome.jsonc's `$schema` and of the dev shell.
      - run: npm i -g @biomejs/biome@2.6.8
      # temzdf-script's build script bundles the shipped scripts with it; the
      # dev shell's version, as scripts/windows/provision.ps1 installs it.
      - run: npm i -g esbuild@0.27.2
      # Which tools the gate gets (the runner image also has rustup's MSVC
      # toolchain), in the same shell.
      - run: |
          command -v cargo rustc gcc clang make node
          cargo -vV
          rustc -vV
          gcc --version | head -n 1
          clang --version | head -n 1
        shell: msys2 {0}
      - run: cargo xtask check --stream --no-miri
        shell: msys2 {0}
        env:
          # RUSTFLAGS replaces .cargo/config.toml's target rustflags: lld
          # again (the static libghostty-vt links only with it).
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-windows-logs
          path: target/check/
          if-no-files-found: ignore

  # The package output (`nix build`).
  build-with-nix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build --print-build-logs
      - run: ./result/bin/temzdf --help

  prune-cache-build:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-without-nix-

  prune-cache-check-with-nix:
    needs: check-with-nix
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-check-

  prune-cache-windows:
    needs: check-windows
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-windows-
