name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node that runs TypeScript as it is (22.18 or later): the runner's
      # own Node may be older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-docs.ts
