name: Without Nix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    # Only builds and starts the binaries: no test reads Markdown here.
    paths-ignore:
      - 'doc/**'
      - 'experiments/**'
      - '**/*.md'
  pull_request:

permissions:
  contents: read

# A newer push to a branch cancels its runs still going; on main every
# run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # script(1), used by the smoke test, comes with util-linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libfontconfig-dev pkg-config autoconf automake libtool
      # Its default RUSTFLAGS (-D warnings) stay.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: wasm32-wasip1
          cache-shared-key: without-nix
          cache-save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      # libghostty-vt-sys builds libghostty-vt from source with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - run: npm i -g esbuild
      - run: scripts/deps-without-nix.sh "$RUNNER_TEMP/deps" >>"$GITHUB_ENV"
      - run: cargo xtask fetch-fonts
      - run: cargo build --locked -p temzdf -p temzdf-gui
      - run: scripts/smoke-session.sh target/debug

  prune:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune-rust-cache.yml
    with:
      key-prefix: v0-rust-without-nix-
